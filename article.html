1. 今回の学習ポイント

中国語の「才（cái）」は、日常会話で非常によく使われる副詞です。

日本語では、文脈によって次のように訳されます。

* ～してやっと
* ～になって初めて
* まだ～しか
* ～だけ
* ようやく

「才」の基本的なイメージは、話し手が予想していたよりも遅い、少ない、または条件が限られているということです。

今回は、初級学習者が覚えておきたい基本的な使い方を紹介します。

2. 基本的な使い方

① 時間が遅いことを表す

「才」は、ある出来事が予想より遅く起こったことを表します。

例文：

① 我昨天晚上十二点才睡觉。
Wǒ zuótiān wǎnshang shí’èr diǎn cái shuìjiào.
昨日の夜、私は12時になってやっと寝ました。

解説：
12時という時間が遅いと感じていることを表します。

② 他今天早上九点才起床。
Tā jīntiān zǎoshang jiǔ diǎn cái qǐchuáng.
彼は今朝9時になってやっと起きました。

解説：
起きる時間が遅かったというニュアンスがあります。

③ 我昨天晚上十一点才到家。
Wǒ zuótiān wǎnshang shíyī diǎn cái dào jiā.
私は昨日の夜11時になってやっと家に着きました。

解説：
家に着くまでに時間がかかったことを表しています。

② 数量が少ないことを表す

「才」は、数量が予想より少ないことを表す場合にも使われます。

例文：

① 我才二十岁。
Wǒ cái èrshí suì.
私はまだ20歳です。

解説：
20歳という年齢が、話し手の感覚では若いことを表します。

② 这本书才十块钱。
Zhè běn shū cái shí kuài qián.
この本はたった10元です。

値段が安い、つまり金額が少ないと感じていることを表します。

③ 今天才来了三个人。
Jīntiān cái lái le sān ge rén.
今日はたった3人しか来ませんでした。

解説：
来た人の数が予想より少なかったことを表します。

「只有A，才B」という形で使います。

一生懸命勉強して初めて、良い成績を取ることができます。

良い成績を取るためには、努力して勉強することが必要だという意味です。

時間があることが、旅行に行くための条件になっています。

3. 「才」と「就」を比較してみましょう

「才」と「就」は、時間を表すときによく対比されます。

基本的には、

才：予想より遅い
就：予想より早い

という違いがあります。

例文：

① 他早上六点就起床了。
Tā zǎoshang liù diǎn jiù qǐchuáng le.
彼は朝6時にはもう起きました。

→ 起きる時間が早いというニュアンスです。

② 他早上九点才起床。
Tā zǎoshang jiǔ diǎn cái qǐchuáng.
彼は朝9時になってやっと起きました。

→ 起きる時間が遅いというニュアンスです。

このように、同じ「起きる」という動作でも、「才」と「就」によって話し手の感じ方が変わります。

4. 日本人が間違えやすいポイント

日本語の「やっと」「たった」「まだ」などは、文脈によって中国語の「才」に対応します。

しかし、すべての場合に「才」を使えるわけではありません。

特に、時間や数量を表すときは、話し手がどのように感じているかが重要です。

例えば：

我八点到了。
私は8時に着きました。

我八点才到。
私は8時になってやっと着きました。

（3）一生懸命勉強して初めて、中国語が上手になります。

② 数量が少ない：才三个人

「只有……才……」

只有努力，才能成功。

日本語では、

時間ではありません。

「努力しなければ成功しない。」

努力という条件が満たされて、

只有努力，才能成功。

と言います。

同じように、

只有下雨，我们才不去。

只有认真学习，才能考上大学。

なども、

結果が成立するためには、

前の条件が必要だ、

という意味になります。

つまり、

ここでの「才」は、

条件を満たして初めて結果が成立する

ことを表しているんですね。`
