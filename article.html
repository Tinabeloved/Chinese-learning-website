    <script>
        const articles = {
            S1: {
                title: "ピンインとは何ですか？",
                content: `漢語拼音は中国語の発音学習の基礎ツールで、声母（頭子音）、韻母（母音）、声調から構成されます。
            1. 声母（Initials）： 21個あり、音節の最初にくる子音を表します。例：b、p、m、f
            2. 韻母（Finals）： 単母音、複母音、鼻音韻母などが含まれます。例：a、o、e、i、u、ü
            3. 声調（Tones）： 基本的な4つの声調と軽声があり、漢字の意味を区別する役割を果たします。例：mā（妈・お母さん）、má（麻・麻）、mǎ（马・馬）、mà（骂・叱る）
            声母 ＋ 韻母 ＋ 声調 ＝ 完全なピンイン
            例： shēng（声母＋韻母）＋ chǎn（声母＋韻母）＝ shēngchǎn（生产・生産）`
            },
            S2: {
                title: "中国語のピンイン（拼音）",
                content: `中国語のピンインは、漢字の発音をアルファベットで表したものです。主に「声母」「韵母」「声調」の組み合わせでできています。また、「整体認読音節」は、音節全体をそのまま覚えて読むものです。
            1. 声母（せいぼ）
            声母とは、音節の最初にくる子音のことです。中国語の声母は全部で21個あります。
            声母（21個）：
            b、p、m、f、d、t、n、l、g、k、h、j、q、x、zh、ch、sh、r、z、c、s
            発音のポイント：
            - b、p、m、f：唇を使って発音します。
            - d、t、n、l：舌先を使って発音します。
            - g、k、h：舌の奥を使って発音します。
            - j、q、x：舌の前の部分を使って発音します。
            - zh、ch、sh、r：舌先を少し反らせて発音します。
            - z、c、s：舌先と歯の近くで発音します。
            2. 韵母（いんぼ）
            韵母とは、母音を中心とした音の部分です。単独で使うことも、声母と組み合わせて使うこともあります。
            ① 単韵母（たんいんぼ）：6個
            a、o、e、i、u、ü
            母音を中心とした基本的な韵母です。「ü」は日本語の「ウ」と異なり、唇を丸めたまま「イ」に近い舌の位置で発音します。
            ② 複韵母（ふくいんぼ）：
            ai、ei、ao、ou、ia、ie、ua、uo、üe、iao、iu、uai、ui
            複数の母音を組み合わせた韵母です。
            ③ 前鼻音韵母（ぜんびおんいんぼ）：
            an、en、in、un、ün、ian、uan、üan
            母音の後ろに「n」がつく韵母です。
            ④ 後鼻音韵母（こうびおんいんぼ）：
            ang、eng、ing、ong、iang、uang、ueng、iong
            母音の後ろに「ng」がつく韵母です。
            ⑤ その他、よく学ぶ韵母：
            er
            ※ 韵母の数や分類方法は教材によって異なります。上記は学習しやすいように分類した一覧です。
            3. 整体認読音節（せいたいにんどくおんせつ）
            整体認読音節とは、声母と韵母に分けて考えず、音節全体をそのまま覚えて読むものです。一般的な中国語の初級教材では16個あります。
            整体認読音節（16個）：
            zhi、chi、shi、ri、zi、ci、si、yi、wu、yu、ye、yue、yuan、yin、yun、ying
            覚えるポイント：
            - zhi、chi、shi、ri：舌先を少し反らせて発音します。
            - zi、ci、si：舌先と歯の近くで発音します。
            - yi、wu、yu：母音から始まる音節で、決まった綴りを覚えます。
            - ye、yue、yuan、yin、yun、ying：通常の綴りの規則だけで考えず、音節全体で覚えます。
            4. まとめ
            - 声母（声母）： 音節の最初にくる子音
            - 韵母（韵母）： 母音を中心とした部分
            - 整体認読音節（整体认读音节）： 音節全体をそのまま覚えて読むもの
            - 声調（声调）： 音の高さや変化を表し、中国語では意味を区別する重要な要素です。
            例えば、「妈（mā）」の場合、声母は「m」、韵母は「a」、声調は第一声です。`
            },
            G1: {
                title: "中国語の一般的な語順",
                content: `
            主語＋述語+（目的語）
        主語は主に名詞、代名詞
        述語は主に動詞、形容詞
        述語は主語について何をするのか、何なのか、どんな状態・性質なのかを説明
        中国語の3種類の述語
        動詞述語文　　例：他吃饭 　　我是老师
        名詞述語文　　例：今天星期天
        形容詞述語文　例：今天很热 明天冷 她很漂亮`
            },
        };

        const A = new URLSearchParams(window.location.search);
        const key = A.get("title");

        if (articles[key]) {
            document.getElementById("art-title").innerText = articles[key].title;
            document.getElementById("art-content").innerHTML = articles[key].content;
        } else {
            console.log("article can't be found")
        }
    </script>
